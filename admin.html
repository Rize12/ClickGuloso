<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Clique Esperto</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>

<body>
  <a class="pular-link" href="#conteudo">Pular para o conteúdo principal</a>

  <header>
    <div class="cabecalho">
      <h1 class="logo">
        Clique Esperto
        <span>Painel do administrador</span>
      </h1>

      <div class="controles">
        <button type="button" class="botao-icone" id="aumentarFonte" aria-label="Aumentar tamanho do texto">A+</button>
        <button type="button" class="botao-icone" id="diminuirFonte" aria-label="Diminuir tamanho do texto">A-</button>
        <button type="button" class="botao-icone" id="alternarContraste" aria-pressed="false" aria-label="Ativar alto contraste">◐</button>
      </div>
    </div>
  </header>

  <main id="conteudo">
    <section id="telaLoginAdmin" aria-labelledby="titulo-login-admin">
      <h2 id="titulo-login-admin">Acesso restrito</h2>

      <p>Entre com a conta de administrador.</p>

      <form id="formLoginAdmin" novalidate>
        <label for="emailAdmin">E-mail</label>
        <input type="email" id="emailAdmin" required autocomplete="email" />

        <label for="senhaAdmin">Senha</label>
        <input type="password" id="senhaAdmin" required autocomplete="current-password" />

        <button type="submit" class="botao-principal">Entrar</button>
      </form>

      <p class="feedback" id="statusAdmin" role="status" aria-live="polite"></p>
    </section>

    <section id="telaPainel" class="escondido" aria-labelledby="titulo-painel">
      <h2 id="titulo-painel">Conversas de suporte</h2>

      <label for="seletorUsuario">Escolha uma conversa</label>
      <select id="seletorUsuario"></select>

      <div id="areaChatAdmin" aria-live="polite"></div>

      <form id="formResposta" novalidate>
        <label for="respostaAdmin">Responder</label>
        <textarea id="respostaAdmin" rows="3" maxlength="300" required></textarea>

        <button type="submit" class="botao-principal">Enviar resposta</button>
      </form>

      <p class="feedback" id="statusResposta" role="status" aria-live="polite"></p>

      <button type="button" id="botaoSairAdmin" class="botao-principal">Sair</button>
    </section>
  </main>

  <footer>
    <p><strong>Clique Esperto</strong> — painel administrativo.</p>
  </footer>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
